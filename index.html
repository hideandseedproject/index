<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>佔領空地｜資料索引</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#f3eee2;--card:#fbf8f0;--ink:#2b2a22;--mute:#75705f;--line:#d8d0bb;--acc:#4a6b3a;--accbg:#dfe8d0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1d18;--card:#25261f;--ink:#e9e5d6;--mute:#a19c88;--line:#3a3b30;--acc:#a6c98a;--accbg:#34402a}}
:root[data-theme="dark"]{--bg:#1c1d18;--card:#25261f;--ink:#e9e5d6;--mute:#a19c88;--line:#3a3b30;--acc:#a6c98a;--accbg:#34402a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Serif TC","Songti TC",PMingLiU,serif}
main{max-width:980px;margin:0 auto;padding:36px 20px 56px}
h1{font-size:36px;letter-spacing:.06em;margin:0 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
a.card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:18px 18px 16px;text-decoration:none;color:var(--ink);transition:transform .12s,border-color .12s}
a.card:hover,a.card:focus-visible{border-color:var(--acc);transform:translateY(-2px)}
.icon{width:46px;height:46px;border-radius:12px;background:var(--accbg);display:flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:26px;height:26px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ttl{font-size:17px;font-weight:700;margin:0}
.tag{display:inline-block;font-size:11.5px;color:var(--acc);background:var(--accbg);padding:2px 8px;border-radius:99px;margin:2px 0 0;align-self:flex-start}
.desc{font-size:13.5px;color:var(--mute);margin:0;line-height:1.55}
</style></head><body><main>
<h1>佔領空地｜資料索引</h1>
<div class="grid">

<a class="card" href="https://hideandseedproject.github.io/gantt/" target="_blank" rel="noopener">
 <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="11" height="3" rx="1"/><rect x="3" y="10.5" width="16" height="3" rx="1"/><rect x="3" y="16" width="7" height="3" rx="1"/></svg></div>
 <p class="ttl">工作進度甘特圖</p>
 <span class="tag">網頁工具</span>
 <p class="desc">各項工作的時間與進度。</p>
</a>

<a class="card" href="https://www.google.com/maps/d/u/0/edit?mid=1HMv36YiYcdculy-NCgTNJW1TO4hukYk&usp=sharing" target="_blank" rel="noopener">
 <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
 <p class="ttl">共編種植地圖</p>
 <span class="tag">Google 地圖（共編）</span>
 <p class="desc">標記認領的空地位置，可共同編輯。</p>
</a>

<a class="card" href="https://hideandseedproject.github.io/plant/" target="_blank" rel="noopener">
 <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 21V11"/><path d="M12 13c0-4 3-7 7-7 0 4-3 7-7 7Z"/><path d="M12 15c0-3.3-2.5-6-6-6 0 3.3 2.5 6 6 6Z"/></svg></div>
 <p class="ttl">植物照顧手冊</p>
 <span class="tag">網頁工具</span>
 <p class="desc">查詢各植物的照顧與採收方式。</p>
</a>

<a class="card" href="https://docs.google.com/spreadsheets/d/1PWxqbPACGE4qa_GitbL6TscS54k7ex5nXk5pDIQwIbc/edit?pli=1&gid=239551205#gid=239551205" target="_blank" rel="noopener">
 <div class="icon"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M9 4v16"/></svg></div>
 <p class="ttl">植物種植時間參考表</p>
 <span class="tag">Google 試算表</span>
 <p class="desc">各植物的播種到採收時間。</p>
</a>

<a class="card" href="https://docs.google.com/spreadsheets/d/1PWxqbPACGE4qa_GitbL6TscS54k7ex5nXk5pDIQwIbc/edit?pli=1&gid=1673394856#gid=1673394856" target="_blank" rel="noopener">
 <div class="icon"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/><path d="M8 3v3h8V3" fill="none"/></svg></div>
 <p class="ttl">個人植物認領表</p>
 <span class="tag">Google 試算表・同一份文件的另一分頁</span>
 <p class="desc">登記每人認領的植物與空地。</p>
</a>

<a class="card" href="https://drive.google.com/drive/folders/1ZS-oppAKAuj7IKfE6lIz9i2XDJ7vPO4L" target="_blank" rel="noopener">
 <div class="icon"><svg viewBox="0 0 24 24"><path d="M4 18.5V7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v9.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5Z"/></svg></div>
 <p class="ttl">給學校的200字心得</p>
 <span class="tag">Google 雲端硬碟</span>
 <p class="desc">上傳個人200字心得。</p>
</a>

</div>
</main></body></html>
